<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="PayumoStyling.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <title>Sign Up Form</title>
  </head>
  <body>
    <h1 id="title">Sign-Up Form</h1>
    <p id="description">
      Create your account by providing the information below. We're glad to have
      you here.
    </p>

    <form id="survey-form">
      <fieldset>
        <label id="name-label" class="formatting">
          <span class="field-name">Name</span>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="Enter your name"
            required
          />
        </label>

        <label id="email-label" class="formatting">
          <span class="field-name">Email</span>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="Enter your email"
            required
          />
        </label>

        <label id="contact-label" class="formatting">
          <span class="field-name">Contact Number</span>
          <input
            id="contact"
            name="contact"
            type="tel"
            placeholder="Enter your preferred contact number"
            required
          />
        </label>

        <label id="number-label" class="formatting">
          <span class="field-name">Age</span>
          <input
            id="number"
            name="number"
            type="number"
            min="13"
            max="120"
            placeholder="Enter your age"
            required
          />
        </label>

        <div id="sex-label" class="formatting">
          <span class="field-name">Sex</span>

          <label class="form-option">
            <input type="radio" id="male" name="sex" value="male" checked />
            Male
          </label>

          <label class="form-option">
            <input type="radio" id="female" name="sex" value="female" />
            Female
          </label>
        </div>
      </fieldset>

      <fieldset>
        <label for="dropdown" id="role-label" class="formatting">
          <span class="field-name">Which role best describes you?</span>
          <select id="dropdown" name="role" class="form-select" required>
            <option disabled selected value="">(select one)</option>
            <option value="student">Student</option>
            <option value="employed full time">Employed Full-Time</option>
            <option value="employed part time">Employed Part-Time</option>
            <option value="unemployed">Unemployed</option>
            <option value="prefer not to say">Prefer not to say</option>
            <option value="other">Other</option>
          </select>
        </label>

        <label for="streaming-dropdown" id="streaming-label" class="formatting">
          <span class="field-name">
            Which streaming platform do you prefer the most?
          </span>
          <select
            id="streaming-dropdown"
            name="streaming-service"
            class="form-select"
            required
          >
            <option disabled selected value="">(select one)</option>
            <option value="netflix">Netflix</option>
            <option value="disney plus">Disney+</option>
            <option value="prime">Prime Video</option>
            <option value="max">Max</option>
            <option value="hulu">Hulu</option>
            <option value="apple tv">Apple TV+</option>
            <option value="peacock">Peacock</option>
            <option value="paramount">Paramount</option>
            <option value="crunchyroll">Crunchyroll</option>
            <option value="other">Other</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <p id="often-label" class="formatting">
          <span class="field-name">
            How often do you watch movies or TV shows?
          </span>
        </p>

        <label for="every-day" class="form-option">
          <input
            id="every-day"
            type="radio"
            name="frequency"
            value="every day"
            required
            checked
          />
          Every Day
        </label>

        <label for="a-few-times-a-week" class="form-option">
          <input
            id="a-few-times-a-week"
            type="radio"
            name="frequency"
            value="a few times a week"
            required
          />
          A few times a week
        </label>

        <label for="once-a-week" class="form-option">
          <input
            id="once-a-week"
            type="radio"
            name="frequency"
            value="once a week"
            required
          />
          Once a week
        </label>

        <label for="a-few-times-a-month" class="form-option">
          <input
            id="a-few-times-a-month"
            type="radio"
            name="frequency"
            value="a few times a month"
            required
          />
          A few times a month
        </label>

        <label for="rarely" class="form-option">
          <input
            id="rarely"
            type="radio"
            name="frequency"
            value="rarely"
            required
          />
          Rarely
        </label>
      </fieldset>

      <fieldset>
        <p id="genre" class="formatting">
          <span class="field-name"> Which genres do you enjoy the most? </span>
        </p>

        <label class="form-option">
          <input type="checkbox" name="genres" value="action" /> Action
        </label>

        <label class="form-option">
          <input type="checkbox" name="genres" value="comedy" /> Comedy
        </label>

        <label class="form-option">
          <input type="checkbox" name="genres" value="drama" /> Drama
        </label>

        <label class="form-option">
          <input type="checkbox" name="genres" value="horror" /> Horror
        </label>

        <label class="form-option">
          <input type="checkbox" name="genres" value="romance" /> Romance
        </label>

        <label class="form-option">
          <input type="checkbox" name="genres" value="sci-fi" /> Sci-Fi
        </label>

        <label class="form-option">
          <input type="checkbox" name="genres" value="animation" /> Animation
        </label>

        <label class="form-option">
          <input type="checkbox" name="genres" value="documentary" />
          Documentary
        </label>
      </fieldset>

      <fieldset>
        <label for="comments" id="comment-label" class="formatting">
          <span class="field-name">
            What is your favorite movie or TV show? Why?
          </span>
        </label>

        <textarea
          id="comments"
          name="comments"
          rows="3"
          cols="50"
          placeholder="I love Jujutsu Kaisen because it...."
          class="form-option"
        ></textarea>
      </fieldset>

      <input id="submit" type="submit" value="Submit" />
    </form>
    <script src="landing.js" defer></script>
  </body>
</html>
